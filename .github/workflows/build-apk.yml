name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [dev, main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Install Capacitor (CI only)
        run: npm install --no-save @capacitor/core@^6 @capacitor/cli@^6 @capacitor/android@^6

      - name: Init Capacitor and add Android platform
        run: |
          npx cap init Overcast app.overcast.pwa --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Generate app icons and splash
        run: |
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android --iconBackgroundColor '#dbe4eb'

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      - name: Patch Gradle signing config
        run: node scripts/patch-android-signing.js

      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/app/upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload signed release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: overcast-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
