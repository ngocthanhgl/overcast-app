name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [dev, main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Install Capacitor (CI only)
        run: npm install --no-save @capacitor/core@^6 @capacitor/cli@^6 @capacitor/android@^6

      - name: Init Capacitor and add Android platform
        run: |
          npx cap init Overcast app.overcast.pwa --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: overcast-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
